[package]
name = "mistralrs-paged-attn"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Vendored from mistral.rs @ v0.9.3 (mistralrs-paged-attn) for quantized KV-cache work"
license = "MIT"

[dependencies]
candle-core = "0.11"
half = "2.7"
float8 = "0.7"
thiserror = "1"

[build-dependencies]
anyhow = "1"
cudaforge = { version = "0.1.6", optional = true }

[features]
cuda = ["dep:cudaforge", "candle-core/cuda"]
